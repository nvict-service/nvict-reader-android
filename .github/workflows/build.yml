name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secret KEYSTORE_BASE64 ontbreekt; de app wordt niet ondertekend en niet gepubliceerd."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "SIGNED=true" >> "$GITHUB_ENV"

      - name: Bouwen (APK + AAB)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: nvict-reader
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --console=plain assembleRelease bundleRelease 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          if [ "$RC" != "0" ]; then
            # Fouten als annotaties, zodat ze ook zonder het volledige log leesbaar zijn
            { grep -E "^e: " build.log | head -40; grep -A8 "What went wrong" build.log | head -60; } > errors.txt
            MSG=$(head -c 3800 errors.txt | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::${MSG}"
          fi
          exit $RC

      - name: Bestanden hernoemen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/NVictReader-1.0.${BUILD_NUMBER}.apk"
          cp app/build/outputs/bundle/release/*.aab "out/NVictReader-1.0.${BUILD_NUMBER}.aab"
          ls -l out

      - name: Artifact (ook bij onondertekende testbuild)
        uses: actions/upload-artifact@v4
        with:
          name: NVictReader-1.0.${{ github.run_number }}
          path: out/*

      - name: Release op GitHub (APK voor nvict.nl / sideloaden)
        if: env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v1.0.${BUILD_NUMBER}" out/*.apk \
            --target "${{ github.sha }}" \
            --title "NVict Reader 1.0.${BUILD_NUMBER}" \
            --notes "${NOTES:-Handmatige build}"

      - name: Service-account voor Google Play
        if: env.SIGNED == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::Secret PLAY_SERVICE_ACCOUNT_JSON ontbreekt; de AAB wordt niet naar Google Play geüpload."
            exit 0
          fi
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
          echo "PLAY_UPLOAD=true" >> "$GITHUB_ENV"

      - name: Uploaden naar Google Play (interne test)
        if: env.PLAY_UPLOAD == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJson: ${{ runner.temp }}/play-service-account.json
          packageName: nl.nvict.reader
          releaseFiles: out/*.aab
          track: internal
          status: completed
          releaseName: 1.0.${{ github.run_number }}
          whatsNewDirectory: distribution/whatsnew
